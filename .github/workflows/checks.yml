name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Thermal guard unit tests
        run: python3 -m unittest discover -s thermal-guard/tests -v
      - name: Thermal guard shell syntax
        run: |
          sh -n thermal-guard/install.sh
          sh -n thermal-guard/85c-resume
      - name: Thermal guard combined systemd units
        run: |
          unit_check_dir=$(mktemp -d)
          mkdir -p "$unit_check_dir/ryzenadj.service.d" "$unit_check_dir/redmi-mode.service.d"
          cp thermal-guard/systemd/ryzenadj.service thermal-guard/systemd/ryzenadj.timer "$unit_check_dir/"
          cp systemd/redmi-mode.service "$unit_check_dir/"
          cp thermal-guard/systemd/85c-guard.conf "$unit_check_dir/ryzenadj.service.d/"
          cp thermal-guard/systemd/30-thermal-lock.conf "$unit_check_dir/redmi-mode.service.d/"
          systemd-analyze verify "$unit_check_dir/ryzenadj.service" "$unit_check_dir/ryzenadj.timer" "$unit_check_dir/redmi-mode.service"
      - name: JavaScript syntax
        run: |
          node --check applet/redmi-mode@local/applet.js
          node --check applet/redmi-mode@local/state.js
          node --check tests/test_applet.js
      - name: Metadata and SVG validation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import xml.etree.ElementTree as ET
          json.loads(Path('applet/redmi-mode@local/metadata.json').read_text())
          for path in Path('.').rglob('*.svg'):
              ET.parse(path)
          PY
      - name: Translation catalog validation
        run: |
          sudo apt-get update
          sudo apt-get install --yes gettext
          msgfmt --check po/ru.po -o /tmp/redmi-mode.mo
          cmp /tmp/redmi-mode.mo applet/redmi-mode@local/locale/ru/LC_MESSAGES/redmi-mode@local-1.0.3.mo
      - name: systemd unit validation
        run: systemd-analyze verify systemd/redmi-mode.service systemd/redmi-mode.timer
