[Unit]
Description=Maintain RyzenAdj thermal ceiling at 85 C
ConditionPathExists=/usr/local/libexec/redmi-mode/ryzenadj

[Service]
Type=oneshot
User=root
RemainAfterExit=no
ExecStart=
ExecStart=/usr/bin/python3 -I /usr/local/libexec/redmi-thermal-guard/guard.py
WorkingDirectory=/
RuntimeDirectory=redmi-mode
RuntimeDirectoryMode=0755
RuntimeDirectoryPreserve=yes
UMask=0022
TimeoutStartSec=16
KillMode=control-group
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=yes
PrivateTmp=yes
ReadWritePaths=/run/redmi-mode
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
RestrictAddressFamilies=AF_UNIX AF_NETLINK
LockPersonality=yes
